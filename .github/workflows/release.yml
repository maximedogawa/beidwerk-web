name: release
# When a release is published (never on a push): the website's Docker image, pushed to
# ghcr.io/<owner>/beidwerk-web with the release's tag, and "latest" unless it is a pre-release.
# The songs and videos are not in it; the server mounts them (see README.md).
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.14" }
      - name: every page link and picture is there
        run: python build.py
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          # a pre-release gets its own tag only; "latest" (what the server runs) moves with full releases
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
            ${{ !github.event.release.prerelease && format('ghcr.io/{0}:latest', github.repository) || '' }}
