name: release
# When a release is published (never on a push): the website's Docker image, pushed to
# ghcr.io/<owner>/beidwerk-web with the release's tag, and "latest" unless it is a pre-release.
# The songs and videos are not in it; the server mounts them (see README.md).
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12" }
      - name: every page link and picture is there
        run: python build.py
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: true
          # a pre-release gets its own tag only; "latest" (what the server runs) moves with full releases
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
            ${{ !github.event.release.prerelease && format('ghcr.io/{0}:latest', github.repository) || '' }}
