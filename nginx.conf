server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;  # no log of visits (the legal page says so)
    error_log /dev/stderr crit;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json application/json;

    open_file_cache max=1000 inactive=60s;

    # pages: asked again on every visit (cheap with gzip), so a release shows at once
    location / { try_files $uri $uri/ =404; expires -1; }

    # the look: every page links it with ?v=<content hash>, so a new release is a new address
    location /assets/ { expires 1y; }

    # pictures keep their names when they change: a day
    location /img/   { expires 1d; }
    location /logos/ { expires 1d; }
    location /marks/ { expires 1d; }

    # the songs and music videos come from the server's media folder (mounted at /media), not from the image;
    # nginx answers byte ranges itself, so players seek. A new cut has a new ?v= in the page.
    location /audio/ { alias /media/audio/; expires 7d; }
    location /video/ {
        alias /media/video/;
        expires 7d;
        limit_rate_after 8m;  # the start comes at full speed, then about 16 Mbit/s: above the highest bitrate
        limit_rate 2m;
    }
}
